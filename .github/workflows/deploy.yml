name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: warhammer-companion/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: warhammer-companion

      - name: Build
        run: npm run build
        working-directory: warhammer-companion

      - name: Deploy to gh-pages
        working-directory: warhammer-companion/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          git commit -m "Deploy from main@$(git -C ../.. rev-parse --short HEAD)"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/InteractionJackson/wargames.git" HEAD:gh-pages
